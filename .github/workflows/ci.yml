# Build, test and (where the runner has a Metal GPU) run the library on
# GitHub's macOS runners: the second and third machines this project was
# never validated on. See docs/pipeline.md "Continuous integration".
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # build.zig.zon is the single source of truth for the pinned nightly.
      # Old nightlies disappear from ziglang.org; setup-zig also tries the
      # community mirrors, and this step fails if none of them has it.
      - name: Read the pinned Zig version
        id: zig
        run: echo "version=$(sed -n 's/.*\.minimum_zig_version = "\(.*\)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          # Both legs share the job id and download the same tarball, so
          # without this they would compute the same cache key and one leg's
          # cache would never be saved.
          cache-key: ${{ matrix.os }}

      - name: Runner
        run: |
          sw_vers
          zig version
          echo "MACOS_MAJOR=$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_ENV"

      # Also compiles metallib-check, which needs no GPU to build.
      - name: Unit tests (no GPU needed)
        run: zig build test

      # `install` compiles and links the app; `metallib` installs the library.
      - name: Build the app and default.metallib (macos26 profile)
        run: zig build install metallib

      # Control for the runtime checks below: can this runner's GPU build a
      # pipeline at all? Apple's own compiler builds a trivial kernel from MSL
      # written here (the repo keeps no .metal files), and on macOS 26 runners
      # it also re-assembles this project's printed IR. Read it with the
      # runtime check that follows (the default library on macOS 26, the
      # macos15 experiment on macOS 15):
      #   control fails           -> the runner's (virtual) GPU, not this project
      #   control ok, ours fails  -> this project's output; the Apple-assembled
      #                              IR then tells our assembler and packer
      #                              apart from the IR itself
      # A third rung has Apple compile the same control kernel with opaque
      # pointers, the only kind this project's assembler writes. On macOS 26
      # runners: typed passes and opaque fails -> this GPU's compiler rejects
      # opaque pointers (on a real M3 both pass for a macOS 26 target); that
      # is what run 36266828343 showed on GitHub's virtual GPU. On
      # macOS 15 the rung compiles for AIR 2.7, which a real M3 on macOS 26
      # also fails ("Failed to upgrade function bitcode"), so only a pass
      # there says something: opaque pointers accepted under AIR 2.7. The
      # rung is informational and does not affect the step's result.
      # Apple's compile, a missing toolchain and a runner without a Metal device
      # get their own "not run" rows, so none of them reads as a GPU failure.
      # Diagnostic only: it never fails the run. Results go to the job summary.
      - name: Control, Apple-compiled kernels on this runner's GPU
        continue-on-error: true
        run: |
          # Xcode 26 ships the Metal toolchain as a separate component. If it is
          # missing and cannot be fetched, say so instead of blaming the GPU.
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          if xcrun metal --version >/dev/null 2>&1; then toolchain=ok; else toolchain=missing; fi
          cat > "$RUNNER_TEMP/control.metal" <<'EOF'
          #include <metal_stdlib>
          kernel void control(device float *a [[buffer(0)]], uint i [[thread_position_in_grid]]) { a[i] = a[i] * 2.0f; }
          EOF
          # A check's state: ok, fail, or why it did not run. `zig build`
          # turns metallib-check's exit 77 into 1, so SKIP is read from the
          # output, as in the runtime-check steps.
          state() { if grep -q '^SKIP no Metal device' <<<"$1"; then echo nodevice; elif [ "$2" -eq 0 ]; then echo ok; else echo fail; fi; }
          set +e
          device=
          compile=unavailable
          control=unavailable
          opaque=unavailable
          ours_apple=unavailable
          if [ "$toolchain" = ok ]; then
            if xcrun metal -mmacosx-version-min="$MACOS_MAJOR.0" "$RUNNER_TEMP/control.metal" -o "$RUNNER_TEMP/control.metallib"; then
              compile=ok
              out=$(zig build check -- --kernel=control "$RUNNER_TEMP/control.metallib" 2>&1); rc=$?
              echo "$out"
              device=$(grep -m1 '^info device ' <<<"$out" | cut -d' ' -f3-)
              control=$(state "$out" "$rc")
            else
              compile=fail
              control=notrun
            fi
            if [ "$compile" != ok ]; then
              opaque=notrun
            elif xcrun metal -Xclang -opaque-pointers -mmacosx-version-min="$MACOS_MAJOR.0" "$RUNNER_TEMP/control.metal" -o "$RUNNER_TEMP/control_opaque.metallib"; then
              oout=$(zig build check -- --kernel=control "$RUNNER_TEMP/control_opaque.metallib" 2>&1); rc=$?
              echo "$oout"
              opaque=$(state "$oout" "$rc")
              # Below macOS 26 a failure has no real-GPU baseline (see above).
              if [ "$opaque" = fail ] && [ "$MACOS_MAJOR" -lt 26 ]; then opaque=fail-nobaseline; fi
            else
              opaque=compile-fail
            fi
            ours_apple=skipped
            if [ "$MACOS_MAJOR" -ge 26 ]; then
              if xcrun metal -Xclang -opaque-pointers zig-out/bin/shader.air.ll -o "$RUNNER_TEMP/xcheck.metallib"; then
                xout=$(zig build check -- "$RUNNER_TEMP/xcheck.metallib" 2>&1); rc=$?
                echo "$xout"
                ours_apple=$(state "$xout" "$rc")
              else
                ours_apple=assemble-fail
              fi
            fi
          fi
          set -e
          result() {
            case "$1" in
              ok) echo ok ;;
              fail) echo FAIL ;;
              assemble-fail) echo "FAIL (Apple's assembler rejected the IR)" ;;
              compile-fail) echo "FAIL (Apple's opaque-pointer compile failed)" ;;
              fail-nobaseline) echo "FAIL (inconclusive: a real M3 fails this AIR 2.7 target too)" ;;
              nodevice) echo "not run (no Metal device)" ;;
              notrun) echo "not run (Apple's compile failed)" ;;
              skipped) echo "skipped (needs macOS 26)" ;;
              unavailable) echo "not run (no Metal toolchain on this runner)" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "### GPU control on ${{ matrix.os }}"
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| Metal toolchain (xcrun metal) | $toolchain |"
            echo "| GPU | ${device:-unknown} |"
            echo "| Apple's compiler builds the MSL kernel | $(result $compile) |"
            echo "| pipeline from Apple's kernel (the control) | $(result $control) |"
            echo "| same kernel, compiled by Apple with opaque pointers | $(result $opaque) |"
            echo "| this project's IR, assembled by Apple | $(result $ours_apple) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$control" = nodevice ] || [ "$ours_apple" = nodevice ]; then
            echo "::warning::no Metal device on this runner; the GPU control could not run"
          fi
          case "$control" in ok | nodevice) ;; *) exit 1 ;; esac
          case "$ours_apple" in ok | skipped | nodevice) ;; *) exit 1 ;; esac

      # The default library targets macOS 26 and cannot load on older macOS.
      # GitHub's arm64 runners are VMs that may expose an "Apple Paravirtual
      # device" rather than no device, so the checks can run on a virtual GPU;
      # confirm any failure here on a real Mac before blaming the library.
      # With no device at all, metallib-check prints SKIP: the step then still
      # passes (green), with a ::warning:: annotation and a line in the job
      # summary saying nothing was checked.
      # On a real Apple GPU any failure here fails the run. On GitHub's virtual
      # GPU ("Apple Paravirtual device") exactly one failure is reported
      # instead of fatal: the one measured in CI run 36263730445, where that
      # device's compiler could not build a compute pipeline from this
      # project's IR (CompilerError Code=2), even when Apple assembled it,
      # while the same library passes every check on a real M3. Any other
      # failure there (library load, function lookup, a wrong dispatch
      # result, a crash) still fails the run. The warning and the job summary
      # keep the downgraded result visible, so a green run never hides it.
      - name: Runtime checks, default library
        if: env.MACOS_MAJOR >= 26
        run: |
          set +e
          out=$(zig build check -- zig-out/bin/default.metallib 2>&1); rc=$?
          set -e
          echo "$out"
          if grep -q '^SKIP no Metal device' <<<"$out"; then
            echo "::warning::no Metal device on this runner; runtime checks skipped"
            echo "Runtime checks skipped: no Metal device on ${{ matrix.os }}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          first=$(grep -m1 '^FAIL' <<<"$out" | cut -c1-200)
          if [ "$rc" -ne 0 ] && grep -q '^info device .*Paravirtual' <<<"$out" \
            && grep -q '^FAIL newComputePipelineState .*Domain=CompilerError Code=2' <<<"$first"; then
            echo "::warning::GitHub's virtual GPU (Apple Paravirtual device) could not build a compute pipeline from this project's IR, the known failure from CI run 36263730445 (it rejects opaque pointers, confirmed in run 36266828343); informational only, real Apple GPUs stay strict. First failure: $first"
            echo "Runtime checks on ${{ matrix.os }}: FAILED on the virtual GPU (Apple Paravirtual device), reported as informational. First failure: \`$first\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $rc

      # The open question target.zig cannot answer on macOS 26: does macOS 15
      # read this project's opaque-pointer bitcode under an AIR 2.7 stamp? The
      # macOS 26 upgrader refuses it; macOS 15 reads 2.7 natively. Expected to
      # be unknown, so a failure here does not fail the run.
      - name: Experiment, unverified macos15 library on macOS 15
        if: env.MACOS_MAJOR == 15
        continue-on-error: true
        run: |
          zig build metallib -Dmetal-target=macos15 -Dallow-unverified-target=true
          set +e
          out=$(zig build check -- zig-out/bin/default.metallib 2>&1); rc=$?
          set -e
          echo "$out"
          if grep -q '^SKIP no Metal device' <<<"$out"; then
            echo "::warning::no Metal device on this runner; the macos15 experiment could not run"
            echo "macos15 experiment skipped: no Metal device on ${{ matrix.os }}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $rc
